# 亿方万能画笔 AnyThingDraw 三架构构建与发布
#
# 推送 v* 标签触发：
#   1. 编译 Win32 / x64 / ARM64 三个架构（MSVC v143 + .NET Framework）
#   2. NSIS 打包出三架构安装包（请求 UAC、默认装到 Program Files\AnyThingDraw）
#   3. 上传 GitHub Release
#   4. 用 gsync 同步 Release 与附件到 CNB（InspireWorks/AnyThingDraw）
#   5. 调用亿方智云 ci_publish 写入三处理器安装包（供软件内自动更新使用）

name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VALUE }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验发布标记
        run: |
          if ! grep -q '^#define IDT_RELEASE$' AnyThingDraw/IdtMain.h; then
            echo "::error::AnyThingDraw/IdtMain.h 中没有 #define IDT_RELEASE，这不是发布版本"
            exit 1
          fi
          echo "发布标记校验通过"

      - name: 提取软件版本号
        id: version
        run: |
          V=$(grep -oP '^wstring editionDate = L"\K[^"]+' AnyThingDraw/IdtMain.cpp)
          if [ -z "$V" ]; then
            echo "::error::未能从 IdtMain.cpp 提取 editionDate"
            exit 1
          fi
          echo "VALUE=$V" >> "$GITHUB_OUTPUT"
          echo "软件版本: $V" >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=${{ github.ref_name }}
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md 2>/dev/null \
              || gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null \
              || gh release view "$TAG" > /dev/null
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: create-release
    strategy:
      matrix:
        platform: [Win32, x64, ARM64]
      fail-fast: false
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 获取环境信息
        id: environmentInfo
        shell: pwsh
        run: |
          $os = Get-ComputerInfo | Select-Object -ExpandProperty OsName
          $ver = Get-ComputerInfo | Select-Object -ExpandProperty OsVersion
          echo "OS=$os" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "OS_VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup .NET Framework 4.0
        shell: pwsh
        run: |
          $zipPath = ".\ActionsRes\v4.0.zip"
          $tempPath = ".\temp"
          $targetParent = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"
          Expand-Archive -Path $zipPath -DestinationPath $tempPath
          if (!(Test-Path $targetParent)) {
            New-Item -Path $targetParent -ItemType Directory | Out-Null
          }
          Copy-Item -Path "$tempPath\v4.0" -Destination $targetParent -Recurse -Force

      - name: Restore NuGet packages
        run: nuget restore "AnyThingDraw.sln"

      - name: 填充 CI/CD 变量
        shell: pwsh
        env:
          STRUCT_BLOCK: |
            struct
            {
              wstring url = L"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";

              wstring repoUrl = L"{{RepoUrl}}";
              wstring branch = L"${{ github.ref_name }}";
              wstring submitter = L"${{ github.actor }}";
              wstring buildTime = L"{{UTCTIME}}";

              wstring buildOS = L"${{ steps.environmentInfo.outputs.OS }}";
              wstring buildOSVersion = L"${{ steps.environmentInfo.outputs.OS_VERSION }}";
              wstring buildRunnerImageOS = L"{{ImageOS}}";
              wstring buildRunnerImageVersion = L"{{ImageVersion}}";

              wstring msBuildVersion = L"{{MSBUILDVER}}";
            } settingCICD;
        run: |
          $file = 'AnyThingDraw\IdtSetting.cpp'
          $content = Get-Content $file

          $pattern = '(?ms)^\s*// signal1.*?\s*// signal1'

          $nowUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $imageOS = $Env:ImageOS
          $imageVer = $Env:ImageVersion
          $repoUrl = "$Env:GITHUB_SERVER_URL/$Env:GITHUB_REPOSITORY"

          $msbuildVersion = (msbuild /version) -join "`n"
          $msbuildVersionEscaped = $msbuildVersion -replace "`r?`n",'\n'
          $msbuildVersionEscaped = $msbuildVersionEscaped -replace '"','\"'

          $structText = $env:STRUCT_BLOCK `
            -replace '\{\{UTCTIME\}\}', $nowUtc `
            -replace '\{\{RepoUrl\}\}', $repoUrl `
            -replace '\{\{ImageOS\}\}', $imageOS `
            -replace '\{\{ImageVersion\}\}', $imageVer `
            -replace '\{\{MSBUILDVER\}\}', $msbuildVersionEscaped

          $replacement = $structText -replace "`r*`n", "`r`n"
          $newContent = ($content -join "`r`n") -replace $pattern, $replacement

          Set-Content -Path $file -Value $newContent -Encoding utf8

      - name: Build AnyThingDraw
        run: msbuild "AnyThingDraw.sln" /p:Configuration=Release /p:Platform=${{ matrix.platform }} /verbosity:minimal
        shell: cmd

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyThingDraw-${{ matrix.platform }}
          path: |
            ${{ (matrix.platform == 'Win32' && './Release/AnyThingDraw.exe') ||
                (matrix.platform == 'x64' && './x64/Release/AnyThingDraw.exe') ||
                './ARM64/Release/AnyThingDraw.exe' }}
            ${{ (matrix.platform == 'Win32' && './Release/AnyThingDraw.pdb') ||
                (matrix.platform == 'x64' && './x64/Release/AnyThingDraw.pdb') ||
                './ARM64/Release/AnyThingDraw.pdb' }}
            ${{ (matrix.platform == 'Win32' && './Release/PptCOM.dll') ||
                (matrix.platform == 'x64' && './x64/Release/PptCOM.dll') ||
                './ARM64/Release/PptCOM.dll' }}

  package:
    name: Package NSIS
    needs: [check, build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 下载各架构构建产物
        uses: actions/download-artifact@v4
        with:
          path: download

      - name: 整理各架构文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\ia32, dist\x64, dist\arm64, out | Out-Null
          Copy-Item "download\AnyThingDraw-Win32\*" dist\ia32 -Force
          Copy-Item "download\AnyThingDraw-x64\*"   dist\x64  -Force
          Copy-Item "download\AnyThingDraw-ARM64\*" dist\arm64 -Force
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: 安装 NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: 打包三架构安装程序
        shell: pwsh
        run: |
          $ver = "${{ needs.check.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          # 位数引导使用 CNB 直链（同步完成后可下载）
          $base  = "https://cnb.cool/InspireWorks/AnyThingDraw/-/releases/download/$tag"
          $url64  = "$base/atdraw-$ver-Setup-x64.exe"
          $urlarm = "$base/atdraw-$ver-Setup-arm64.exe"
          $nsis  = "C:\Program Files (x86)\NSIS\makensis.exe"
          $icon  = "$PWD\AnyThingDraw\src\icon.ico"

          $targets = @(
            @{ Arch = "ia32";  Dir = "$PWD\dist\ia32" },
            @{ Arch = "x64";   Dir = "$PWD\dist\x64" },
            @{ Arch = "arm64"; Dir = "$PWD\dist\arm64" }
          )
          foreach ($t in $targets) {
            Write-Host "=== 打包 $($t.Arch) ==="
            & $nsis "/DARCH=$($t.Arch)" "/DAPPVERSION=$ver" "/DSRCDIR=$($t.Dir)" `
              "/DICONPATH=$icon" "/DARCH64URL=$url64" "/DARCHARM64URL=$urlarm" `
              "/DOUTDIR=$PWD\out" "Installer\AnyThingDraw.nsi"
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::打包 $($t.Arch) 失败"; exit 1 }
          }
          Get-ChildItem out

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: out/*.exe

  upload-release:
    name: Upload to GitHub Release
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: out

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ github.ref_name }}
          ls -la out
          gh release upload "$TAG" out/*.exe --clobber --repo ${{ github.repository }}

  # 用 CNB 官方 gsync 工具同步 Release 到 CNB（引用附件优先用 CNB 直链，
  # 故必须先完成同步，亿方智云发布 job 依赖本 job）
  sync-cnb:
    name: Sync to CNB
    needs: [upload-release]
    runs-on: ubuntu-latest
    steps:
      - name: Install gsync (build from source)
        run: |
          git clone --depth 1 https://cnb.cool/5.5/CNB/sync/gsync.git /tmp/gsync-src
          cd /tmp/gsync-src
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/gsync" .
          "$HOME/.local/bin/gsync" --help | head -5

      - name: Create CNB Release (skip if exists)
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gsync releases create \
            --source-repo https://cnb.cool/InspireWorks/AnyThingDraw.git \
            --source-username cnb \
            --source-token "$CNB_TOKEN" \
            --tags ${{ github.ref_name }}

      - name: Sync Release + attachments to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          TAG=${{ github.ref_name }}
          DL_DIR=/tmp/release-assets
          rm -rf "$DL_DIR" && mkdir -p "$DL_DIR" && cd "$DL_DIR"
          gsync releases download \
            --source-repo https://github.com/${{ github.repository }}.git \
            --source-username github-actions \
            --source-token "$GITHUB_TOKEN" \
            --tag "$TAG"
          # 逐文件上传（一次整批会被 CNB 限制导致附件不全）
          find . -type f -name "*.exe" | while read -r f; do
            n=0
            until gsync releases upload \
              --target-repo https://cnb.cool/InspireWorks/AnyThingDraw.git \
              --target-username cnb \
              --target-token "$CNB_TOKEN" \
              --tag "$TAG" \
              --files "$f"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "::error::上传 $f 到 CNB 失败（已重试 3 次）"
                exit 1
              fi
              echo "上传 $f 失败，10 秒后重试（第 $n 次）"
              sleep 10
            done
          done

      # gsync 只在创建 Release 时写入描述，已存在时不会更新，
      # 标题/正文单独走 CNB API（PATCH /-/releases/{id}）
      - name: Sync Release description to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=${{ github.ref_name }}
          INFO=$(gh release view "$TAG" --json name,body)
          RID=$(curl -sf -H "Authorization: token $CNB_TOKEN" -H "Accept: application/json" \
            "https://api.cnb.cool/InspireWorks/AnyThingDraw/-/releases/tags/$TAG" | jq -r .id)
          echo "$INFO" | jq -c '{name: .name, body: .body}' | curl -sf -X PATCH \
            -H "Authorization: token $CNB_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" \
            --data-binary @- \
            "https://api.cnb.cool/InspireWorks/AnyThingDraw/-/releases/$RID"
          echo "CNB Release 标题与正文已同步"

  publish-cloud:
    name: Publish to 亿方智云
    needs: sync-cnb
    runs-on: ubuntu-latest
    steps:
      - name: 下载安装包（计算大小与校验和）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ github.ref_name }}
          mkdir -p out
          gh release download "$TAG" --repo ${{ github.repository }} --pattern '*.exe' --dir out
          ls -la out

      - name: 发布版本信息到亿方智云
        env:
          RELEASE_TOKEN: ${{ secrets.YF_RELEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=${{ github.ref_name }}
          VER=${TAG#v}
          BASE="https://cnb.cool/InspireWorks/AnyThingDraw/-/releases/download/$TAG"

          size_of() { stat -c%s "out/$1"; }
          sha_of()  { sha256sum "out/$1" | cut -d' ' -f1; }

          CHANGELOG=$(gh release view "$TAG" --repo ${{ github.repository }} --json body -q .body)

          jq -n \
            --arg slug "atdraw" \
            --arg version "$TAG" \
            --arg release_date "$(date +%F)" \
            --arg changelog "$CHANGELOG" \
            --arg page_url "https://cnb.cool/InspireWorks/AnyThingDraw/-/releases/tag/$TAG" \
            --arg url32  "$BASE/atdraw-$VER-Setup-ia32.exe" \
            --arg url64  "$BASE/atdraw-$VER-Setup-x64.exe" \
            --arg urlarm "$BASE/atdraw-$VER-Setup-arm64.exe" \
            --argjson size32  "$(size_of atdraw-$VER-Setup-ia32.exe)" \
            --argjson size64  "$(size_of atdraw-$VER-Setup-x64.exe)" \
            --argjson sizearm "$(size_of atdraw-$VER-Setup-arm64.exe)" \
            --arg sha32  "$(sha_of atdraw-$VER-Setup-ia32.exe)" \
            --arg sha64  "$(sha_of atdraw-$VER-Setup-x64.exe)" \
            --arg shaarm "$(sha_of atdraw-$VER-Setup-arm64.exe)" \
            '{
              slug: $slug,
              version: $version,
              release_date: $release_date,
              changelog: $changelog,
              page_url: $page_url,
              assets: [
                { os: "win32", arch: "ia32",  os_label: "Windows（32 位）",   url: $url32,  size_bytes: $size32,  sha256: $sha32 },
                { os: "win32", arch: "x64",   os_label: "Windows（64 位）",   url: $url64,  size_bytes: $size64,  sha256: $sha64 },
                { os: "win32", arch: "arm64", os_label: "Windows（ARM64）", url: $urlarm, size_bytes: $sizearm, sha256: $shaarm }
              ]
            }' > body.json

          echo "--- 发布内容 ---"
          cat body.json | head -50

          HTTP=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            "https://api.yfyw.top/api.php?route=ci_publish" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: $RELEASE_TOKEN" \
            --data-binary @body.json)
          echo "HTTP $HTTP"
          cat resp.json

          if [ "$HTTP" != "201" ]; then
            echo "::error::亿方智云版本发布失败（HTTP $HTTP）"
            exit 1
          fi
          echo "亿方智云版本信息发布成功"
